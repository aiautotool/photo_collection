name: Build Installers

on:
  push:
    branches: [photosync-suite-v1]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm --workspace @photosync/desktop run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoSync-Windows-x64
          path: desktop/release/*.exe
          if-no-files-found: error

  macos_x64:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm --workspace @photosync/desktop run dist:mac:x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoSync-macOS-x64
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
          if-no-files-found: error

  macos_arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm --workspace @photosync/desktop run dist:mac:arm64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoSync-macOS-arm64
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx expo prebuild --platform android --clean --no-install
        working-directory: mobile
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: mobile/android
      - run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk PhotoSync-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoSync-Android-APK
          path: PhotoSync-Android.apk
          if-no-files-found: error

  ios_simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx expo prebuild --platform ios --clean --no-install
        working-directory: mobile
      - run: pod install
        working-directory: mobile/ios
      - run: |
          xcodebuild \
            -workspace PhotoSync.xcworkspace \
            -scheme PhotoSync \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
        working-directory: mobile/ios
      - run: |
          cd mobile/ios/build/Build/Products/Release-iphonesimulator
          zip -r "$GITHUB_WORKSPACE/PhotoSync-iOS-Simulator.app.zip" PhotoSync.app
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoSync-iOS-Simulator
          path: PhotoSync-iOS-Simulator.app.zip
          if-no-files-found: error
